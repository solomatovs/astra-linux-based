# Раздача статического бандла (vite build). Заменяет дефолтный nginx.conf
# базового dmp/nginx: логи в stdout/stderr контейнера, /healthz через stub_status.
# mime.types содержит application/wasm — важно для PGlite
worker_processes  1;

error_log  /dev/stderr notice;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;
    sendfile    on;

    # бандл three.js ~1МБ — текстовые типы сжимаем на лету
    # (wasm PGlite не сжимаем: ~10МБ, дорого на каждый запрос)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen       80;
        server_name  _;
        root         /etc/nginx/html;

        location = /healthz { stub_status; }

        # имена ассетов vite содержат хэш содержимого — кэшируем навсегда
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
