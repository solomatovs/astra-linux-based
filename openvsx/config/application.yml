# Конфиг по умолчанию, запекается в образ как /home/openvsx/server/config/application.yml.
# Все значения переопределяются в рантайме без пересборки:
#   - стандартными spring-переменными окружения, напр.
#       SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/openvsx
#       SPRING_DATASOURCE_USERNAME=... SPRING_DATASOURCE_PASSWORD=...
#       OVSX_WEBUI_URL, OVSX_STORAGE_LOCAL_DIRECTORY и т.д.
#   - либо монтированием своего файла поверх: -v ./application.yml:/home/openvsx/server/config/application.yml
#
# Отличия от апстримного deploy/docker/configuration/application.yml — офлайн-дефолты:
#   ovsx.databasesearch.enabled=true, ovsx.elasticsearch.enabled=false
#       поиск по базе вместо elasticsearch — без отдельного кластера ES
#   ovsx.extension-control.update-on-start=false
#       иначе сервер на старте ходит на github за списком extension-control

server:
  port: 8080
  jetty:
    threads:
      max-queue-capacity: 100

spring:
  application:
    name: openvsx-server
  profiles:
    include: ovsx
  cache:
    jcache:
      config: classpath:ehcache.xml
  datasource:
    url: jdbc:postgresql://localhost:5432/openvsx
    username: openvsx
    password: openvsx
  flyway:
    baseline-on-migrate: true
    baseline-version: 0.1.0
    baseline-description: JobRunr tables
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: none
            client-secret: none

management:
  health:
    probes:
      enabled: true
    # клиенты elasticsearch и redis лежат в classpath, поэтому spring зондирует
    # localhost и валит health в DOWN, хотя сами сервисы здесь не используются
    elasticsearch:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus

springdoc:
  model-and-view-allowed: true
  swagger-ui:
    path: /swagger-ui
    docExpansion: list
    operationsSorter: alpha
    supportedSubmitMethods:
      - get

org:
  jobrunr:
    job-scheduler:
      enabled: true
    background-job-server:
      enabled: true
      worker-count: 2
    dashboard:
      enabled: false
    database:
      type: sql
    miscellaneous:
      allow-anonymous-data-usage: false

bucket4j:
  enabled: true
  filters:
    - cache-name: buckets
      url: '/api/-/(namespace/create|publish)'
      http-response-headers:
        Access-Control-Allow-Origin: '*'
        Access-Control-Expose-Headers: X-Rate-Limit-Retry-After-Seconds, X-Rate-Limit-Remaining
      rate-limits:
        - cache-key: getParameter("token")
          bandwidths:
            - capacity: 15
              time: 1
              unit: seconds
    - cache-name: buckets
      url: '/vscode/asset/.*/.*/.*/Microsoft.VisualStudio.Services.Icons.Default'
      http-response-headers:
        Access-Control-Allow-Origin: '*'
        Access-Control-Expose-Headers: X-Rate-Limit-Retry-After-Seconds, X-Rate-Limit-Remaining
      rate-limits:
        - cache-key: getRemoteAddr()
          bandwidths:
            - capacity: 75
              time: 1
              unit: seconds
    - cache-name: buckets
      url: '/vscode/(?!asset/.*/.*/.*/Microsoft.VisualStudio.Services.Icons.Default).*|/api/(?!(.*/.*/review(/delete)?)|(-/(namespace/create|publish))).*'
      http-response-headers:
        Access-Control-Allow-Origin: '*'
        Access-Control-Expose-Headers: X-Rate-Limit-Retry-After-Seconds, X-Rate-Limit-Remaining
      rate-limits:
        - cache-key: getRemoteAddr()
          bandwidths:
            - capacity: 15
              time: 1
              unit: seconds

ovsx:
  databasesearch:
    enabled: true
  elasticsearch:
    enabled: false
  extension-control:
    update-on-start: false
  integrity:
    key-pair: create
  registry:
    version: <OVSX_VERSION>
  storage:
    local:
      directory: /home/openvsx/storage
