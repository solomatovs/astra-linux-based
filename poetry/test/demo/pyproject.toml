# Демо-проект для smoke-теста образа dmp/poetry.
#
# Формат намеренно старый ([tool.poetry], а не PEP 621 [project]): его понимают
# и poetry 1.8, и poetry 2.x, а тест один на всю цепочку версий.
#
# Зависимостей нет специально: тест идёт с --network none, а любая зависимость
# потребовала бы похода в индекс. Проверяется то, что обязано работать оффлайн:
# check / lock / build / install --no-root / создание venv.
[tool.poetry]
name = "demo"
version = "0.1.0"
description = "offline smoke-test package for dmp/poetry"
authors = ["dmp <dmp@example.com>"]
readme = "README.md"
packages = [{ include = "demo", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
