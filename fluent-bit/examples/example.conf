# Один пример на все возможности плагинов dmp/fluent-bit.
#
# Файл рабочий целиком (проходит `fluent-bit -c … --dry-run`), но в бою из него
# берут нужные куски: держать все входы включёнными разом смысла нет.
#
# Разбор каждого параметра и картинки потока событий — в README.md рядом.
#
#   Запуск:
#     docker run --rm -e PG_TARGETS=pg-1:5432 -e PG_USER=… -e PG_PASSWORD=… \
#       -e PG_DATABASE=postgres -e CH_TARGETS=ch-1:8123 -e CH_USER=default \
#       -e CH_PASSWORD=… -p 2021:2021 dmp/fluent-bit:5.0 \
#       -c /usr/local/share/fluent-bit/examples/example.conf
#
# Плагины проекта (все пять — в plugins.conf, отдельно подключать не надо):
#   postgres   — вход и выход; SQL к PostgreSQL через libpq (умеет Kerberos)
#   clickhouse — вход и выход; SQL к ClickHouse по HTTP/HTTPS
#   pg2ch      — насос PostgreSQL → ClickHouse через COPY
#
# Соглашение о тегах: metric.* — метрики, log.* — записи. Смешивать их в одном
# выходе нельзя: prometheus_exporter принимает только метрики.

[SERVICE]
    Flush             5
    Log_Level         info
    # без этой строки плагинов проекта не существует
    Plugins_File      /usr/local/etc/fluent-bit/plugins.conf
    storage.path      /var/lib/fluent-bit/
    # служебный интерфейс самого fluent-bit: /api/v1/metrics, /api/v1/health.
    # Ни TLS, ни пароля у него нет — наружу выставлять только через прокси
    HTTP_Server       On
    HTTP_Listen       127.0.0.1
    HTTP_Port         2020


# ============================================================================
# ВХОД 1. PostgreSQL → метрики prometheus
#
# Запрос отдаёт счётчики по базам, плагин делает из каждого числового столбца
# gauge с именем <Metric_Prefix>_<столбец>. Метки — instance (плагин ставит сам)
# плюс перечисленные в Label_Fields столбцы.
# ============================================================================
[INPUT]
    Name              postgres
    Tag               metric.pg.database
    Mode              metrics
    Metric_Prefix     pg_database
    Label_Fields      database
    Targets           ${PG_TARGETS}
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          ${PG_DATABASE}
    Query_File        /usr/local/share/fluent-bit/queries/pg/database.sql
    Interval_Sec      15

# Value_Fields задаётся явно, когда в результате есть числа, которым в метриках
# не место: pid, oid, номера версий
[INPUT]
    Name              postgres
    Tag               metric.pg.tables
    Mode              metrics
    Metric_Prefix     pg_table
    Label_Fields      schema, table
    Value_Fields      n_live_tup, n_dead_tup, seq_scan, idx_scan, total_bytes
    Targets           ${PG_TARGETS}
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          ${PG_DATABASE}
    Query_File        /usr/local/share/fluent-bit/queries/pg/tables.sql
    Interval_Sec      60


# ============================================================================
# ВХОД 2. PostgreSQL → записи
#
# Тот же плагин без Mode отдаёт строку результата как запись со всеми полями.
# Годится для того, что метрикой быть не может: тексты запросов, pid, состояния
# ============================================================================
[INPUT]
    Name              postgres
    Tag               log.pg.activity
    Targets           ${PG_TARGETS}
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          ${PG_DATABASE}
    Query_File        /usr/local/share/fluent-bit/queries/pg/activity.sql
    Interval_Sec      10


# ============================================================================
# ВХОД 3. ClickHouse → метрики
#
# Time_Field берёт время события из самого ответа: в system.metric_log лежат
# дельты за секунду, и время строки важнее времени опроса
# ============================================================================
[INPUT]
    Name              clickhouse
    Tag               metric.ch.node
    Mode              metrics
    Metric_Prefix     clickhouse
    Time_Field        event_ts
    Targets           ${CH_TARGETS}
    User              ${CH_USER}
    Password          ${CH_PASSWORD}
    Query_File        /usr/local/share/fluent-bit/queries/ch/metrics.sql
    Interval_Sec      10

# Mode both: одни и те же строки уходят дважды — записями под Tag и метриками
# под Metrics_Tag. Один выход принять и то, и другое не может
[INPUT]
    Name              clickhouse
    Tag               log.ch.parts
    Mode              both
    Metrics_Tag       metric.ch.parts
    Metric_Prefix     clickhouse_parts
    Label_Fields      database, table
    Targets           ${CH_TARGETS}
    User              ${CH_USER}
    Password          ${CH_PASSWORD}
    Query_File        /usr/local/share/fluent-bit/queries/ch/parts.sql
    Interval_Sec      30


# ============================================================================
# ВХОД 4. Журнал ClickHouse с курсором
#
# {CURSOR} в запросе заменяется последним увиденным значением Cursor_Field —
# по каждой ноде своим. Cursor_File хранит его на диске, поэтому перезапуск не
# приносит уже прочитанное заново. Time_Field ставит записи время события.
#
# Cursor_Type и Cursor_Default здесь выписаны своими умолчаниями: убрать их
# можно, но тогда не видно, что подстановкой управляют. Для курсора по
# возрастающему id обе строки обязательно менять:
#     Cursor_Type    number      вместо toDateTime64('42', 6) — просто 42
#     Cursor_Default 0           вместо now() - INTERVAL 30 SECOND
# ============================================================================
[INPUT]
    Name              clickhouse
    Tag               log.ch.part_log
    Targets           ${CH_TARGETS}
    User              ${CH_USER}
    Password          ${CH_PASSWORD}
    Query_File        /usr/local/share/fluent-bit/queries/ch/part_log.sql
    Cursor_Field      event_ts
    Cursor_File       /var/lib/fluent-bit/ch-part_log
    Cursor_Type       datetime64
    Cursor_Default    now() - INTERVAL 30 SECOND
    Time_Field        event_ts
    Interval_Sec      5

# ============================================================================
# ВХОД 5. Насос PostgreSQL → ClickHouse
#
# Данные идут мимо конвейера: PG COPY → CH INSERT напрямую, ~1 млн строк/с.
# В конвейер попадает только запись-отчёт о прогоне. Отметка живёт в целевой
# таблице (Cursor_Query), поэтому падение посреди перегона безопасно, а
# ORDER BY по столбцу отметки в запросе обязателен
# ============================================================================
[INPUT]
    Name              pg2ch
    Tag               log.pump.events
    Pg_Target         ${PG_HOST}
    Pg_User           ${PG_USER}
    Pg_Password       ${PG_PASSWORD}
    Pg_Database       ${PG_DATABASE}
    Ch_Target         ${CH_HOST}
    Ch_User           ${CH_USER}
    Ch_Password       ${CH_PASSWORD}
    Ch_Database       dst
    Ch_Table          events
    Query             SELECT id, ts AT TIME ZONE 'UTC', kind, payload FROM events WHERE id > {CURSOR} ORDER BY id
    Cursor_Query      SELECT coalesce(max(id), 0) FROM dst.events
    Batch_Bytes       64M
    # Schedule — прогон по расписанию, а не по интервалу: тяжёлый перегон
    # незачем гонять днём. Пять полей как в cron (или шесть — с секундами),
    # часовой пояс берётся из TZ контейнера. Interval_Sec при этом остаётся
    # тиком проверки и должен быть не реже минуты
    Schedule          0 2 * * *
    Interval_Sec      60


# ============================================================================
# ВХОД 6. Любой штатный источник — чтобы было что класть в СУБД
# ============================================================================
[INPUT]
    Name              tail
    Tag               log.nginx
    Path              /var/log/nginx/access.log
    Parser            json
    DB                /var/lib/fluent-bit/nginx.db

# внутренние счётчики самого fluent-bit
[INPUT]
    Name              fluentbit_metrics
    Tag               metric.flb
    Scrape_Interval   10


# ============================================================================
# ============================================================================
# ВХОД 8. Обратное соединение: забрать логи с периферии
#
# Когда сеть пускает только ИЗ центра наружу и по одному порту. Центральный
# сам приходит к периферии, а данные идут навстречу. На периферии при этом
# стоит fluent-bit с выходом stream (см. блок в самом низу файла)
# ============================================================================
[INPUT]
    Name              stream
    Tag               log.edge
    Targets           ${EDGE_TARGETS}
    Token             ${EDGE_TOKEN}
    Source_Key        source
    Secure            On
    Verify            Off
    Retry_Pause_Sec   10

# ВХОД 7. Пробы доступности — чёрный ящик снаружи
#
# Один плагин, четыре типа. Имена метрик как у blackbox_exporter, поэтому
# готовые дашборды и алерты работают без переписывания
# ============================================================================

# состояния портов как у nmap: open / closed / filtered
[INPUT]
    Name              probe
    Tag               metric.probe.ports
    Type              tcp
    Targets           ${PG_HOST}:5432, ${CH_HOST}:8123, dc-1:389, dc-1:636
    Timeout_Ms        3000
    Mode              metrics
    Interval_Sec      30

# icmp: сокет берётся непривилегированный, raw — только если ping_group_range закрыт
[INPUT]
    Name              probe
    Tag               metric.probe.icmp
    Type              icmp
    Targets           ${PG_HOST}, ${CH_HOST}, dc-1
    Timeout_Ms        2000
    Mode              metrics
    Interval_Sec      30

# TLS с разбором сертификата. Preamble — там, где TLS начинается не сразу:
#   postgres        8 байт SSLRequest, ответ S/N
#   ldap-starttls   операция расширения LDAP на 389 порту
# Для LDAPS (636) преамбула не нужна — там обычный TLS
# Срок сертификата приезжает сам: probe_ssl_earliest_cert_expiry — unix-время
# истечения (Grafana рисует его датой), probe_ssl_cert_expiry_days — сколько
# дней осталось, под порог в алерте. Mode both добавит запись с читаемой датой
# cert_not_after, например 2028-05-21T15:16:28Z
[INPUT]
    Name              probe
    Tag               metric.probe.tls
    Type              tls
    Targets           ${CH_HOST}:8443, dc-1:636
    Verify            on
    Mode              metrics
    Interval_Sec      60

[INPUT]
    Name              probe
    Tag               metric.probe.tls.pg
    Type              tls
    Targets           ${PG_HOST}:5432
    Preamble          postgres
    Verify            off
    Mode              metrics
    Interval_Sec      60

[INPUT]
    Name              probe
    Tag               metric.probe.tls.ad
    Type              tls
    Targets           dc-1:389
    Preamble          ldap-starttls
    Verify            off
    Mode              metrics
    Interval_Sec      60

# http: метод, код и текст в теле
[INPUT]
    Name              probe
    Tag               metric.probe.http
    Type              http
    Targets           https://portal/health, http://api:8080/live
    Method            GET
    Expect_Status     200
    Expect_Body       ok
    Headers           Authorization: Bearer ${API_TOKEN}; X-Probe: fluent-bit
    Mode              metrics
    Interval_Sec      30


# ============================================================================
# ВЫХОД 1. ClickHouse: SQL над пачкой
#
# Пачка едет телом JSONEachRow и подставляется в input('схема'). Значения в
# текст запроса не попадают — экранировать нечего, инъекции невозможны.
# Здесь на вставке считается минутный срез: в таблицу ложится агрегат,
# а не сырые строки
# ============================================================================
[OUTPUT]
    Name              clickhouse
    Match             log.nginx
    Host              ${CH_HOST}
    Port              8123
    User              ${CH_USER}
    Password          ${CH_PASSWORD}
    Database          logs
    Query             INSERT INTO nginx_minute SELECT toStartOfMinute(timestamp) AS minute, host, status, count() AS hits, sum(bytes) AS bytes FROM input('timestamp DateTime64(6), host String, status UInt16, bytes UInt64') GROUP BY minute, host, status

# Table — короткая запись без SQL: поля записи → одноимённые столбцы,
# лишние поля отбрасываются (Skip_Unknown_Fields on по умолчанию)
[OUTPUT]
    Name              clickhouse
    Match             log.ch.part_log
    Host              ${CH_HOST}
    Database          logs
    Table             part_log_archive


# ============================================================================
# ВЫХОД 2. PostgreSQL: SQL над пачкой
#
# Пачка приезжает параметром $1 типа jsonb — массивом объектов. Разворачивают
# его штатные jsonb_populate_recordset / jsonb_to_recordset
# ============================================================================
[OUTPUT]
    Name              postgres
    Match             log.pg.activity
    Host              ${PG_HOST}
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          audit
    Query             INSERT INTO slow_queries (ts, instance, pid, query, age_sec) SELECT timestamp, instance, pid, query, query_age_sec FROM jsonb_to_recordset($1) AS x(timestamp timestamptz, instance text, pid bigint, query text, query_age_sec double precision) WHERE query_age_sec > 5

# метрики выход тоже принимает: каждая разворачивается в строку фиксированной
# формы name / type / labels / value / timestamp
[OUTPUT]
    Name              postgres
    Match             metric.flb
    Host              ${PG_HOST}
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          metrics
    Table             flb_metrics


# ============================================================================
# ВЫХОД 3. Метрики наружу
# ============================================================================
# Вариант 1 — pull: prometheus сам приходит и забирает с /metrics
[OUTPUT]
    Name              prometheus_exporter
    Match             metric.*
    # TLS и пароля этот плагин не умеет — только петля плюс прокси перед ним
    Host              127.0.0.1
    Port              2021

# Вариант 2 — push: fluent-bit сам отправляет метрики, ждать scrape не нужно.
# Годится там, где до сборщика не достучаться (NAT, закрытый сегмент, машина
# без входящих портов) и где нужна задержка меньше интервала scrape.
#
# На стороне prometheus нужен приёмник: запуск с флагом
#   --web.enable-remote-write-receiver
# Тот же выход умеет http_user/http_passwd и tls — в отличие от экспортёра,
# который не умеет ни того, ни другого.
#
# Включать оба сразу смысла нет: метрики уедут дважды
# [OUTPUT]
#     Name        prometheus_remote_write
#     Match       metric.*
#     Host        ${PROM_HOST}
#     Port        9090
#     Uri         /api/v1/write
#     Tls         Off
#     add_label   source fluent-bit
#     storage.total_limit_size 256M
#     Retry_Limit 5

# отчёты насоса и прочие записи — на глаза
[OUTPUT]
    Name              stdout
    Match             log.pump.*
    Format            json_lines


# ============================================================================
# ВЫХОД 4. Кольцевой буфер с выдачей по запросу
#
# Плагин ничего не пушит: события копятся в кольце на Ring_Size байт, старое
# вытесняется новым, а забирает их потребитель сам:
#
#   curl http://localhost:2022/logs          отдать, ничего не трогая
#   curl http://localhost:2022/logs/clear    отдать и очистить
#   curl -X DELETE http://localhost:2022/logs   то же самое
#   curl http://localhost:2022/stats         сколько лежит и сколько вытеснено
#
# Очистка происходит только если ответ удалось отдать. Одновременные запросы
# сериализуются: всё заберёт первый, остальные получат пусто — дублей не будет.
#
# Важно: плагин отвечает конвейеру «принято» сразу, поэтому Retry_Limit и
# дисковый буфер эти данные не страхуют. Кольцо и есть буфер, и оно по
# определению теряет самое старое
[OUTPUT]
    Name              ring
    Match             log.nginx
    Host              127.0.0.1
    Port              2022
    Uri               /logs
    Ring_Size         64M


# ============================================================================
# ПРИЁМ ИЗВНЕ: TLS и авторизация
#
# Своя авторизация по логину и паролю есть только у forward. У in_http, otel,
# elasticsearch, tcp, syslog — только TLS, пускают любого; у экспортёра метрик
# и служебного порта 2020 нет и TLS. Всё это закрывается прокси (см. README).
#
# Строки tls.* закомментированы, чтобы пример проходил --dry-run без файлов
# сертификатов. С ними проверено: неверный пароль обрывает рукопожатие
# ============================================================================
[INPUT]
    Name              forward
    Tag               log.forward
    Listen            0.0.0.0
    Port              24224
    # tls             on
    # tls.crt_file    /etc/fluent-bit/ssl/server.crt
    # tls.key_file    /etc/fluent-bit/ssl/server.key
    shared_key        ${FLB_SHARED_KEY}
    self_hostname     ${HOSTNAME}
    security.users    ${FLB_USER} ${FLB_PASSWORD}

# ============================================================================
# ЭТО НЕ ДЛЯ ЦЕНТРАЛЬНОГО: конфигурация ПЕРИФЕРИЙНОГО сервера
#
# Слушает порт и ждёт, когда за логами придёт центральный. Пока никто не
# подключён, выход отвечает конвейеру RETRY — и копит не он, а штатный
# дисковый буфер fluent-bit, поэтому переживается и пропажа центра, и
# собственный перезапуск
# ============================================================================
# [SERVICE]
#     storage.path            /var/lib/fluent-bit/buf
#     # потолок буфера: 64 чанка по 2 МБ ≈ 128 МБ
#     storage.max_chunks_up   64
#
# [INPUT]
#     Name              tail
#     Tag               app.nginx
#     Path              /var/log/nginx/access.log
#     DB                /var/lib/fluent-bit/tail.db
#     storage.type      filesystem
#     # на потолке ВСТАТЬ и перестать читать файл, а не терять старое.
#     # Без этого движок выбрасывает самые старые чанки: в опыте из 40 000
#     # строк доставлено 18 184. Пока вход на паузе, буфером служит сам файл,
#     # поэтому запас файлов ротации должен перекрывать простой центра
#     storage.pause_on_chunks_overlimit on
#
# [OUTPUT]
#     Name              stream
#     Match             *
#     # Listen — значит «жду, когда за логами придут». Если вместо него
#     # написать Host, тот же плагин будет подключаться к центру сам:
#     # направление данных от этого не меняется, меняется, кто звонит
#     Listen            0.0.0.0
#     Port              10000
#     Token             ${EDGE_TOKEN}
#     Secure            On
#     Cert_File         /etc/ssl/edge.crt
#     Key_File          /etc/ssl/edge.key
#     Retry_Limit       no_limits
