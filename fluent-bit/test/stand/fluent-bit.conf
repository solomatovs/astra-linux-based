# Конфигурация стенда: оба плагина в режиме metrics и один — в режиме both,
# чтобы проверить и то, и другое за один запуск.
#
# Теги разведены по назначению: metric.* уходит в экспортёр, log.* — в stdout.
# Смешивать нельзя, prometheus_exporter принимает только метрики.

[SERVICE]
    Flush             1
    Log_Level         info
    Plugins_File      /usr/local/etc/fluent-bit/plugins.conf
    storage.path      /var/lib/fluent-bit/
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020

[INPUT]
    Name              postgres
    Tag               metric.pg.meta
    Mode              metrics
    Metric_Prefix     pg
    Targets           ${PG_TARGETS}
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          ${PG_DATABASE}
    Query_File        /usr/local/share/fluent-bit/queries/pg/meta.sql
    Interval_Sec      5

[INPUT]
    Name              postgres
    Tag               metric.pg.database
    Mode              metrics
    Metric_Prefix     pg_database
    Label_Fields      database
    Targets           ${PG_TARGETS}
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          ${PG_DATABASE}
    Query_File        /usr/local/share/fluent-bit/queries/pg/database.sql
    Interval_Sec      5

[INPUT]
    Name              postgres
    Tag               metric.pg.waits
    Mode              metrics
    Metric_Prefix     pg_waits
    Label_Fields      wait_event_type, wait_event, state, backend_type
    Value_Fields      backends
    Targets           ${PG_TARGETS}
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          ${PG_DATABASE}
    Query_File        /usr/local/share/fluent-bit/queries/pg/waits.sql
    Interval_Sec      5

# Value_Fields задан явно — проверяем, что лишние числовые столбцы отсеиваются
[INPUT]
    Name              postgres
    Tag               metric.pg.tables
    Mode              metrics
    Metric_Prefix     pg_table
    Label_Fields      schema, table
    Value_Fields      n_live_tup, n_dead_tup, seq_scan, idx_scan, total_bytes
    Targets           ${PG_TARGETS}
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          ${PG_DATABASE}
    Query_File        /usr/local/share/fluent-bit/queries/pg/tables.sql
    Interval_Sec      5

# режим both: записи уходят в stdout, метрики — в экспортёр
[INPUT]
    Name              clickhouse
    Tag               log.ch.parts
    Mode              both
    Metrics_Tag       metric.ch.parts
    Metric_Prefix     clickhouse_parts
    Label_Fields      database, table
    Targets           ${CH_TARGETS}
    User              ${CH_USER}
    Password          ${CH_PASSWORD}
    Query_File        /usr/local/share/fluent-bit/queries/ch/parts.sql
    Interval_Sec      5

[INPUT]
    Name              clickhouse
    Tag               metric.ch.metrics
    Mode              metrics
    Metric_Prefix     clickhouse
    Time_Field        event_ts
    Targets           ${CH_TARGETS}
    User              ${CH_USER}
    Password          ${CH_PASSWORD}
    Query_File        /usr/local/share/fluent-bit/queries/ch/metrics.sql
    Interval_Sec      5

[INPUT]
    Name              clickhouse
    Tag               metric.ch.async
    Mode              metrics
    Metric_Prefix     clickhouse_async
    Label_Fields      metric
    Value_Fields      value
    Targets           ${CH_TARGETS}
    User              ${CH_USER}
    Password          ${CH_PASSWORD}
    Query_File        /usr/local/share/fluent-bit/queries/ch/asynchronous_metrics.sql
    Interval_Sec      5

# журнал с курсором: событий может не быть, важно что вход не падает
[INPUT]
    Name              clickhouse
    Tag               log.ch.part_log
    Targets           ${CH_TARGETS}
    User              ${CH_USER}
    Password          ${CH_PASSWORD}
    Query_File        /usr/local/share/fluent-bit/queries/ch/part_log.sql
    Cursor_Field      event_ts
    Cursor_File       /var/lib/fluent-bit/ch-part_log
    Cursor_Type       datetime64
    Cursor_Default    now() - INTERVAL 30 SECOND
    Time_Field        event_ts
    Interval_Sec      5

# насос PostgreSQL → ClickHouse: COPY text → INSERT FORMAT TabSeparated.
# Отметка живёт в целевой таблице, boolean и timestamptz приводятся в SELECT
[INPUT]
    Name              pg2ch
    Tag               log.pump.events
    Pg_Target         ${PG_TARGETS}
    Pg_User           ${PG_USER}
    Pg_Password       ${PG_PASSWORD}
    Pg_Database       ${PG_DATABASE}
    Ch_Target         ${CH_TARGETS}
    Ch_User           ${CH_USER}
    Ch_Password       ${CH_PASSWORD}
    Ch_Database       demo
    Ch_Table          pg_events
    Query             SELECT id, ts AT TIME ZONE 'UTC', kind, payload FROM demo_events WHERE id > {CURSOR} ORDER BY id
    Cursor_Query      SELECT coalesce(max(id), 0) FROM demo.pg_events
    Batch_Bytes       4M
    Interval_Sec      5

# --- выходные плагины -------------------------------------------------------
# «логи nginx»: строка с кавычками, табом, переводом и попыткой инъекции —
# всё это должно доехать данными, а не сломать вставку
[INPUT]
    Name              dummy
    Tag               sink.nginx
    Dummy             {"host":"web-1","status":200,"bytes":1024,"msg":"кавычка \" слэш \\ таб\tперевод\nи '; DROP TABLE nginx_agg; --"}
    Rate              20

[INPUT]
    Name              dummy
    Tag               sink.nginx
    Dummy             {"host":"web-2","status":500,"bytes":77,"msg":"plain"}
    Rate              5

# агрегация прямо на вставке: в таблицу ложатся минутные срезы, а не сырые
# строки. Поля msg в схеме input() нет — оно отбрасывается
[OUTPUT]
    Name              clickhouse
    Match             sink.nginx
    Host              clickhouse
    Port              8123
    User              ${CH_USER}
    Password          ${CH_PASSWORD}
    Database          demo
    Query             INSERT INTO nginx_agg SELECT toStartOfMinute(timestamp) AS minute, host, status, count(), sum(bytes) FROM input('timestamp DateTime64(6), host String, status UInt16, bytes UInt64') GROUP BY minute, host, status

# метрики самого fluent-bit — в postgres, метки уезжают в jsonb
[INPUT]
    Name              fluentbit_metrics
    Tag               sink.flb
    Scrape_Interval   5

[OUTPUT]
    Name              postgres
    Match             sink.flb
    Host              postgres
    Port              5432
    User              ${PG_USER}
    Password          ${PG_PASSWORD}
    Database          ${PG_DATABASE}
    Table             flb_metrics

# кольцевой буфер: те же «логи nginx» копятся и отдаются по запросу
[OUTPUT]
    Name              ring
    Match             sink.nginx
    Host              0.0.0.0
    Port              2022
    Uri               /logs
    Ring_Size         16K

# пробы: открытый порт, закрытый порт, icmp и TLS с разбором сертификата
[INPUT]
    Name              probe
    Tag               metric.probe.tcp
    Type              tcp
    Targets           postgres:5432, clickhouse:8123, postgres:9999
    Timeout_Ms        2000
    Mode              metrics
    Interval_Sec      10

[INPUT]
    Name              probe
    Tag               metric.probe.icmp
    Type              icmp
    Targets           postgres, clickhouse
    Timeout_Ms        2000
    Mode              metrics
    Interval_Sec      10

[INPUT]
    Name              probe
    Tag               metric.probe.http
    Type              http
    Targets           http://clickhouse:8123/ping
    Method            GET
    Expect_Status     200
    Expect_Body       Ok
    Mode              metrics
    Interval_Sec      10

# TLS-проба к postgres: преамбула SSLRequest, разбор сертификата и срок.
# Mode both — метрики в prometheus_exporter, запись с cert_not_after в кольцо
[INPUT]
    Name              probe
    Tag               log.probe.tls
    Type              tls
    Targets           postgres:5432
    Preamble          postgres
    Verify            off
    Mode              both
    Metrics_Tag       metric.probe.tls
    Timeout_Ms        2000
    Interval_Sec      10

[OUTPUT]
    Name              prometheus_exporter
    Match             metric.*
    Host              0.0.0.0
    Port              2021

[OUTPUT]
    Name              stdout
    Match             log.*
    Format            json_lines
