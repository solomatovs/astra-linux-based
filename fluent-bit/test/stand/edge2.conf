# Периферия в ЗЕРКАЛЬНОЙ схеме: сама подключается к центру. Применимо там,
# где межсетевой экран пускает наружу периферию, а не наоборот. Данные текут
# в ту же сторону — от неё в центр; поменялось только то, кто звонит.

[SERVICE]
    Flush             1
    Log_Level         info
    Plugins_File      /usr/local/etc/fluent-bit/plugins.conf

[INPUT]
    Name              dummy
    Tag               edge.app
    Dummy             {"msg":"звоню сам","app":"сервис-2"}
    Rate              10

[OUTPUT]
    Name              stream
    Match             edge.*
    Host              fluent-bit
    Port              10001
    Token             стенд
    Node              edge-2
    Retry_Limit       no_limits
