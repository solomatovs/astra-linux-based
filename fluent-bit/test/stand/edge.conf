# Периферия «обратного соединения». Слушает порт и ждёт, когда за логами
# придёт центральный fluent-bit — доступ в этой схеме есть только из центра.
# Пока никто не подключён, out_stream отвечает конвейеру RETRY, и накопление
# берёт на себя штатный дисковый буфер.

[SERVICE]
    Flush                 1
    Log_Level             info
    Plugins_File          /usr/local/etc/fluent-bit/plugins.conf
    storage.path          /var/lib/fluent-bit/edge-buf
    # потолок буфера намеренно крошечный: 2 чанка, чтобы проверка успевала
    # увидеть, как вход встаёт. В бою тут десятки чанков
    storage.max_chunks_up 2

[INPUT]
    Name              dummy
    Tag               edge.app
    Dummy             {"msg":"запрос обработан","app":"сервис"}
    Rate              20
    storage.type      filesystem
    # на потолке ВСТАТЬ, а не выбрасывать старое. Без этого движок при
    # storage.total_limit_size выкидывает самые старые чанки — проверено
    storage.pause_on_chunks_overlimit on

[OUTPUT]
    Name              stream
    Match             edge.*
    Listen            0.0.0.0
    Port              10000
    Token             стенд
    Retry_Limit       no_limits
